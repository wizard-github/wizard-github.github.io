<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SplitMoney</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b5d6b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SplitMoney">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{--bg:#eef1f4;--card:#fff;--tx:#14213d;--mu:#647084;--bd:#d9dee5;--ac:#0b5d6b;--acx:#fff;--pos:#117a3d;--neg:#c62828;--wr:#fde8e8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1621;--card:#17212f;--tx:#e8edf3;--mu:#93a1b5;--bd:#2a3748;--ac:#4cc2d6;--acx:#06222a;--pos:#4ade80;--neg:#ff7b7b;--wr:#3b1c1f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1621;--card:#17212f;--tx:#e8edf3;--mu:#93a1b5;--bd:#2a3748;--ac:#4cc2d6;--acx:#06222a;--pos:#4ade80;--neg:#ff7b7b;--wr:#3b1c1f;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:640px;margin:0 auto;padding:14px 14px 80px}
h1{font-size:1.5rem;margin:6px 0 14px}h2{font-size:1.1rem;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.click{cursor:pointer}.mu{color:var(--mu);font-size:.85rem}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
input,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:11px;margin:4px 0 10px}
input[type=checkbox]{width:22px;height:22px;margin:0;flex:none}
textarea{min-height:70px}
label{display:block;font-size:.85rem;color:var(--mu)}
button{font:inherit;font-weight:600;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:11px 14px;min-height:44px;cursor:pointer}
button.pri{background:var(--ac);color:var(--acx);border-color:var(--ac)}
button.dng{color:var(--neg);border-color:var(--neg)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1;padding:10px 4px}
.tabs button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.tag{font-size:.75rem;padding:3px 9px;border-radius:99px;border:1px solid var(--bd);white-space:nowrap}
.tag.active{color:var(--pos);border-color:var(--pos)}.tag.closed{color:var(--mu)}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.pr{display:grid;grid-template-columns:1fr 5.8rem 5.8rem;gap:8px;align-items:center;margin-bottom:6px}
.pr input{margin:0;text-align:right}
.nm{display:flex;align-items:center;gap:8px;color:var(--tx);font-size:1rem;min-width:0;overflow-wrap:anywhere}
.hd{font-size:.8rem;color:var(--mu);text-align:right}
.chk{border-radius:8px;padding:8px 10px;margin:10px 0;font-size:.9rem;background:var(--bg)}
.chk.bad{background:var(--wr)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.big{font-size:1.2rem;font-weight:700}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="app"></div><div id="toast" role="status"></div>
<script>
/* ==LOGIC== (importi in centesimi interi) */
const toC=s=>{const n=parseFloat(String(s).replace(",",".").trim());return isNaN(n)?0:Math.round(n*100)};
const fmt=c=>(c/100).toLocaleString("it-IT",{minimumFractionDigits:2,maximumFractionDigits:2});
const inp=c=>c?(c/100).toFixed(2).replace(".",","):"";
function splitEqual(total,ids){const o={};if(!ids.length)return o;const b=Math.floor(total/ids.length),r=total-b*ids.length;ids.forEach((id,i)=>o[id]=b+(i===0?r:0));return o}
function balances(ev){const m={};ev.participants.forEach(p=>m[p.id]={id:p.id,name:p.name,paid:0,owed:0});ev.expenses.forEach(x=>x.shares.forEach(s=>{if(m[s.pid]){m[s.pid].paid+=s.paid;m[s.pid].owed+=s.owed}}));return Object.values(m).map(b=>({...b,saldo:b.paid-b.owed}))}
function settle(bs){const cr=bs.filter(b=>b.saldo>0).map(b=>({n:b.name,a:b.saldo})),db=bs.filter(b=>b.saldo<0).map(b=>({n:b.name,a:-b.saldo})),t=[],by=(x,y)=>y.a-x.a;
while(cr.length&&db.length){cr.sort(by);db.sort(by);const c=cr[0],d=db[0],a=Math.min(c.a,d.a);t.push({from:d.n,to:c.n,amount:a});c.a-=a;d.a-=a;if(!c.a)cr.shift();if(!d.a)db.shift()}return t}
/* ==END== */

const KEY="splitmoney.v1";let S={events:[]};
try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&r.events)S=r}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const dIt=d=>d.split("-").reverse().join("/");
let V={ev:null,tab:"mov",conf:null},F=null;
const EV=()=>S.events.find(e=>e.id===V.ev);
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.className="show";clearTimeout(toast.h);toast.h=setTimeout(()=>t.className="",1800)}
function ask(key,fn){if(V.conf===key){V.conf=null;fn()}else{V.conf=key;render()}}
const cl=(k,t,t2)=>V.conf===k?t2:t;

function newEv(){const n=document.getElementById("en").value.trim(),ps=document.getElementById("ep").value.split(/[,\n]/).map(s=>s.trim()).filter(Boolean);
if(!n)return toast("Inserisci il nome dell’evento");if(ps.length<2)return toast("Servono almeno 2 partecipanti");
S.events.unshift({id:uid(),name:n,status:"active",created:today(),participants:ps.map(name=>({id:uid(),name})),expenses:[]});save();V.ev=S.events[0].id;V.tab="mov";render()}
function openEv(id){V.ev=id;V.tab="mov";V.conf=null;F=null;render()}
const home=()=>{V.ev=null;V.conf=null;F=null;render()};
const tab=t=>{V.tab=t;V.conf=null;render()};
function closeEv(){ask("close",()=>{EV().status="closed";save();toast("Evento chiuso");render()})}
function delEv(){ask("delev",()=>{S.events=S.events.filter(e=>e.id!==V.ev);save();home()})}
function addP(){const e=EV(),i=document.getElementById("np"),n=i.value.trim();if(!n)return;e.participants.push({id:uid(),name:n});save();render()}
function renP(id,v){const p=EV().participants.find(p=>p.id===id);if(v.trim()){p.name=v.trim();save()}}
const involved=(e,id)=>e.expenses.filter(x=>x.shares.some(s=>s.pid===id&&(s.paid||s.owed)));
function delP(id){ask("p"+id,()=>{const e=EV(),inv=involved(e,id).map(x=>x.id);e.expenses=e.expenses.filter(x=>!inv.includes(x.id));e.participants=e.participants.filter(p=>p.id!==id);e.expenses.forEach(x=>x.shares=x.shares.filter(s=>s.pid!==id));save();toast("Partecipante eliminato");render()})}
function delX(id){ask("x"+id,()=>{const e=EV();e.expenses=e.expenses.filter(x=>x.id!==id);save();toast("Movimento eliminato");render()})}

function formX(id){const e=EV(),x=id&&e.expenses.find(x=>x.id===id);F={id:id||null,date:x?x.date:today(),desc:x?x.desc:"",total:x?inp(x.total):"",rows:{}};
e.participants.forEach(p=>{const s=x&&x.shares.find(s=>s.pid===p.id);F.rows[p.id]={paid:s?inp(s.paid):"",owed:s?inp(s.owed):"",on:x?!!(s&&s.owed):true}});render()}
function fr(id,k,v){F.rows[id][k]=v;chk()}
function eq(){const ids=EV().participants.filter(p=>F.rows[p.id].on).map(p=>p.id),sp=splitEqual(toC(F.total),ids);
if(!ids.length)return toast("Spunta almeno un partecipante");EV().participants.forEach(p=>F.rows[p.id].owed=inp(sp[p.id]||0));render()}
function sums(){let sp=0,so=0;EV().participants.forEach(p=>{sp+=toC(F.rows[p.id].paid);so+=toC(F.rows[p.id].owed)});return{t:toC(F.total),sp,so}}
function chk(){const{t,sp,so}=sums(),ok=t>0&&sp===t&&so===t&&F.desc.trim()&&F.date,el=document.getElementById("chk");
const line=(l,v)=>`<div class="${v===t&&t>0?"pos":"neg"}">${l}: <span class="mono">${fmt(v)}</span> / <span class="mono">${fmt(t)}</span>${v===t&&t>0?" ✓":` (differenza <span class="mono">${fmt(Math.abs(t-v))}</span>)`}</div>`;
el.className="chk"+(ok?"":" bad");el.innerHTML=line("Pagato",sp)+line("Dovuto",so);document.getElementById("sv").disabled=!ok}
function saveX(){const e=EV(),{t}=sums();const shares=e.participants.map(p=>({pid:p.id,paid:toC(F.rows[p.id].paid),owed:toC(F.rows[p.id].owed)})).filter(s=>s.paid||s.owed);
const x={id:F.id||uid(),date:F.date,desc:F.desc.trim(),total:t,shares};
if(F.id){e.expenses=e.expenses.map(o=>o.id===F.id?x:o)}else e.expenses.push(x);save();F=null;toast("Movimento salvato ✓");render()}

function vHome(){return `<h1>💶 SplitMoney</h1>
<div class="card"><h2>Nuovo evento</h2><input id="en" placeholder="Nome (es. Viaggio in Grecia)"><textarea id="ep" placeholder="Partecipanti, separati da virgola o a capo (minimo 2)"></textarea><button class="pri" onclick="newEv()">Crea evento</button></div>`
+(S.events.map(e=>`<div class="card row click" onclick="openEv('${e.id}')"><div><b>${esc(e.name)}</b><div class="mu">${e.participants.length} partecipanti · ${e.expenses.length} movimenti · ${dIt(e.created)}</div></div><span class="tag ${e.status}">${e.status==="active"?"Attivo":"Chiuso"}</span></div>`).join("")||`<p class="mu">Nessun evento: creane uno qui sopra.</p>`)}

function vForm(){const e=EV();return `<div class="card"><h2>${F.id?"Modifica":"Nuovo"} movimento</h2>
<label>Data<input type="date" value="${F.date}" oninput="F.date=this.value;chk()"></label>
<label>Descrizione<input value="${esc(F.desc)}" oninput="F.desc=this.value;chk()"></label>
<label>Importo totale (€)<input class="mono" inputmode="decimal" value="${esc(F.total)}" oninput="F.total=this.value;chk()"></label>
<div class="row" style="margin:6px 0"><b>Ripartizione</b><button onclick="eq()">Dividi in parti uguali</button></div>
<div class="pr"><span class="mu">Spunta chi partecipa</span><span class="hd">Pagato</span><span class="hd">Dovuto</span></div>`
+e.participants.map(p=>{const r=F.rows[p.id];return `<div class="pr"><label class="nm"><input type="checkbox" ${r.on?"checked":""} onchange="F.rows['${p.id}'].on=this.checked">${esc(p.name)}</label>
<input class="mono" inputmode="decimal" placeholder="0,00" value="${r.paid}" oninput="fr('${p.id}','paid',this.value)" aria-label="Pagato da ${esc(p.name)}">
<input class="mono" inputmode="decimal" placeholder="0,00" value="${r.owed}" oninput="fr('${p.id}','owed',this.value)" aria-label="Dovuto da ${esc(p.name)}"></div>`}).join("")
+`<div id="chk" class="chk"></div><div class="acts"><button onclick="F=null;render()">Annulla</button><button id="sv" class="pri" onclick="saveX()">Salva movimento</button></div></div>`}

function vMov(e){const act=e.status==="active",l=[...e.expenses].sort((a,b)=>b.date.localeCompare(a.date));
return (act?`<button class="pri" style="width:100%;margin-bottom:12px" onclick="formX()">＋ Nuovo movimento</button>`:"")
+(l.map(x=>{const pay=x.shares.filter(s=>s.paid).map(s=>(e.participants.find(p=>p.id===s.pid)||{}).name).filter(Boolean).map(esc).join(", ");
return `<div class="card"><div class="row"><div><b>${esc(x.desc)}</b><div class="mu">${dIt(x.date)} · pagato da ${pay}</div></div><span class="mono big">${fmt(x.total)} €</span></div>`
+(act?`<div class="acts"><button onclick="formX('${x.id}')">✏️ Modifica</button><button class="dng" onclick="delX('${x.id}')">${cl("x"+x.id,"🗑 Elimina","Confermi?")}</button></div>`:"")+`</div>`}).join("")||`<p class="mu">Nessun movimento${act?": aggiungi il primo.":"."}</p>`)}

function vPart(e){const act=e.status==="active";
return `<div class="card">`+e.participants.map(p=>{const n=involved(e,p.id).length;return `<div class="row" style="margin-bottom:8px"><input style="margin:0" value="${esc(p.name)}" ${act?"":"disabled"} onchange="renP('${p.id}',this.value)" aria-label="Nome partecipante">`
+(act?`<button class="dng" ${e.participants.length<=2?"disabled":""} onclick="delP('${p.id}')">${cl("p"+p.id,"🗑",n?"Elimina + "+n+" mov.":"Sicuro?")}</button>`:"")+`</div>`}).join("")
+(act?`<div class="mu">Eliminando un partecipante vengono eliminati anche i movimenti in cui compare. Minimo 2 partecipanti.</div><div class="row" style="margin-top:12px"><input id="np" style="margin:0" placeholder="Nuovo partecipante"><button class="pri" onclick="addP()">Aggiungi</button></div>`:"")+`</div>`}

function vSal(e){const bs=balances(e),tr=settle(bs),tot=e.expenses.reduce((a,x)=>a+x.total,0);
return `<div class="card"><div class="row"><b>Totale spese</b><span class="mono big">${fmt(tot)} €</span></div></div>`
+bs.map(b=>`<div class="card"><div class="row"><b>${esc(b.name)}</b><span class="mono big ${b.saldo>0?"pos":b.saldo<0?"neg":""}">${b.saldo>0?"+":""}${fmt(b.saldo)}</span></div><div class="row mu mono"><span>Pagato ${fmt(b.paid)}</span><span>Dovuto ${fmt(b.owed)}</span></div></div>`).join("")
+`<div class="card"><h2>Chi deve dare cosa</h2>`+(tr.length?tr.map(t=>`<div class="row" style="margin-bottom:6px"><span>${esc(t.from)} → ${esc(t.to)}</span><span class="mono"><b>${fmt(t.amount)} €</b></span></div>`).join("")+`<div class="mu">${tr.length} trasferiment${tr.length===1?"o":"i"} per saldare tutto.</div>`:`<span class="mu">Tutti i conti sono in pari.</span>`)+`</div>`}

function vEv(){const e=EV(),act=e.status==="active";
return `<div class="row" style="margin-bottom:8px"><button onclick="home()">‹ Eventi</button><span class="tag ${e.status}">${act?"Attivo":"Chiuso · sola lettura"}</span></div><h1>${esc(e.name)}</h1>`
+(F?vForm():`<div class="tabs">${[["mov","Movimenti"],["par","Partecipanti"],["sal","Saldi"]].map(([k,l])=>`<button class="${V.tab===k?"on":""}" onclick="tab('${k}')">${l}</button>`).join("")}</div>`
+(V.tab==="mov"?vMov(e):V.tab==="par"?vPart(e):vSal(e))
+`<div class="acts">`+(act?`<button onclick="closeEv()">${cl("close","🔒 Chiudi evento","Confermi chiusura?")}</button>`:"")+`<button class="dng" onclick="delEv()">${cl("delev","Elimina evento","Confermi eliminazione?")}</button></div>`)}

function render(){document.getElementById("app").innerHTML=V.ev&&EV()?vEv():vHome();if(F)chk();scrollTo(0,0)}
render();
if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
</body>
</html>
